<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Каталог книг</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; }
    .error { color: #b00020; }
  </style>
</head>
<body>
<h1>Каталог книг</h1>

<form id="search">
  <input name="q" placeholder="Пошук за назвою або автором">
  <select name="sort">
    <option value="id,asc">За замовчуванням</option>
    <option value="title,asc">Назва А-Я</option>
    <option value="title,desc">Назва Я-А</option>
    <option value="author,asc">Автор А-Я</option>
    <option value="pubYear,desc">Спочатку нові</option>
    <option value="pubYear,asc">Спочатку старі</option>
  </select>
  <select name="size">
    <option>5</option>
    <option selected>10</option>
    <option>20</option>
  </select>
  <button>Знайти</button>
</form>

<table>
  <thead><tr><th>#</th><th>Назва</th><th>Автор</th><th>Рік</th></tr></thead>
  <tbody id="books"></tbody>
</table>
<p>
  <button id="prev">&larr; Назад</button>
  <span id="info"></span>
  <button id="next">Далі &rarr;</button>
</p>
<p class="error" id="error"></p>

<h3>Додати книгу</h3>
<form id="add">
  <input name="title" placeholder="Назва" required maxlength="255">
  <input name="author" placeholder="Автор" required maxlength="255">
  <input name="pubYear" placeholder="Рік" required type="number">
  <button>Додати</button>
</form>

<script>
  let page = 0;

  async function load() {
    const params = new URLSearchParams(new FormData(document.getElementById('search')));
    params.set('page', page);
    const r = await fetch('books?' + params);
    const data = await r.json();
    if (!r.ok) { showError(data); return; }
    showError(null);

    const tbody = document.getElementById('books');
    tbody.innerHTML = '';
    data.items.forEach(b => {
      const tr = document.createElement('tr');
      const link = document.createElement('a');
      link.href = 'book.html?id=' + b.id;
      link.textContent = b.title;
      tr.insertCell().textContent = b.id;
      tr.insertCell().appendChild(link);
      tr.insertCell().textContent = b.author;
      tr.insertCell().textContent = b.pubYear;
      tbody.appendChild(tr);
    });
    const pages = Math.max(data.totalPages, 1);
    document.getElementById('info').textContent =
      `Сторінка ${data.page + 1} з ${pages} (усього книг: ${data.total})`;
    document.getElementById('prev').disabled = data.page === 0;
    document.getElementById('next').disabled = data.page + 1 >= pages;
  }

  function showError(err) {
    document.getElementById('error').textContent = err ? `${err.status} ${err.error}: ${err.message}` : '';
  }

  document.getElementById('search').addEventListener('submit', e => { e.preventDefault(); page = 0; load(); });
  document.getElementById('prev').onclick = () => { page--; load(); };
  document.getElementById('next').onclick = () => { page++; load(); };

  document.getElementById('add').addEventListener('submit', async e => {
    e.preventDefault();
    const r = await fetch('books', { method: 'POST', body: new URLSearchParams(new FormData(e.target)) });
    if (r.ok) { e.target.reset(); load(); } else { showError(await r.json()); }
  });

  load();
</script>
</body>
</html>
