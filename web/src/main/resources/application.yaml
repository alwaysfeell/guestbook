spring:
  application:
    name: guestbook
  main:
    web-application-type: servlet

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  title: Каталог книг і відгуки
  db:
    url: jdbc:h2:file:./data/books;AUTO_SERVER=TRUE
  catalog:
    default-page-size: 10
  comments:
    delete-window: 24h

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{30} - %msg%n"
  level:
    root: INFO
    sumdu.edu.ua: INFO
