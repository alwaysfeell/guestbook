spring:
  application:
    name: guestbook
  main:
    web-application-type: servlet
  config:
    import: optional:file:./mail.properties
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mpf_labs}
    username: ${SPRING_DATASOURCE_USERNAME:mpf_user}
    password: ${SPRING_DATASOURCE_PASSWORD:mpf_pass}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  thymeleaf:
    cache: true
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
    servlet:
      content-type: text/html
  freemarker:
    template-loader-path: classpath:/templates/
    charset: UTF-8

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Каталог книг і відгуки
    version: 1.0.0-SNAPSHOT

mail:
  resend:
    api-url: https://api.resend.com/emails
    api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:BookApp <onboarding@resend.dev>}

app:
  title: Каталог книг і відгуки
  catalog:
    default-page-size: 10
  comments:
    delete-window: 24h
  mail:
    admin: ${APP_MAIL_ADMIN:}
    base-url: ${APP_BASE_URL:http://localhost:${server.port}}
    logo-url: https://raw.githubusercontent.com/alwaysfeell/guestbook/lab7/web/src/main/resources/static/img/logo.png

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{30} - %msg%n"
  level:
    root: INFO
    sumdu.edu.ua: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
