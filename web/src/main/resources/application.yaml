spring:
  application:
    name: guestbook
  main:
    web-application-type: servlet
  config:
    import: optional:file:./mail.properties
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
    servlet:
      content-type: text/html
  freemarker:
    template-loader-path: classpath:/templates/
    charset: UTF-8
  mail:
    host: smtp.gmail.com
    port: 587
    username: ""
    password: ""
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  title: Каталог книг і відгуки
  db:
    url: jdbc:h2:file:./data/books;AUTO_SERVER=TRUE
  catalog:
    default-page-size: 10
  comments:
    delete-window: 24h
  mail:
    to: ""
    from: ""
    from-name: BookApp
    base-url: http://localhost:${server.port}
    logo-url: https://raw.githubusercontent.com/alwaysfeell/guestbook/lab7/web/src/main/resources/static/img/logo.png

logging:
  charset:
    console: UTF-8
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{30} - %msg%n"
  level:
    root: INFO
    sumdu.edu.ua: INFO
