<header th:fragment="header" xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <nav class="topbar">
        <a class="brand" th:href="@{/books}" th:text="#{app.name}">Каталог книг</a>
        <th:block sec:authorize="isAuthenticated()">
            <a th:href="@{/books}" th:text="#{nav.books}">Книги</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/books/add}" th:text="#{nav.addBook}">Додати книгу</a>
            <a th:href="@{/users}" th:text="#{nav.users}">Користувачі</a>
        </th:block>
        <span class="lang">
            <span th:text="#{nav.language} + ':'">Мова:</span>
            <a href="?lang=uk" th:classappend="${#locale.language == 'uk'} ? 'active'">UA</a>
            <a href="?lang=en" th:classappend="${#locale.language == 'en'} ? 'active'">EN</a>
        </span>
        <span class="account" sec:authorize="isAuthenticated()">
            <span class="whoami">
                <span class="principal" sec:authentication="name">admin</span>
                <span class="badge admin" sec:authorize="hasRole('ADMIN')" th:text="#{role.ADMIN}">адміністратор</span>
                <span class="badge" sec:authorize="hasRole('USER')" th:text="#{role.USER}">користувач</span>
            </span>
            <form th:action="@{/logout}" method="post" class="logout">
                <button type="submit" th:text="#{nav.logout}">Вийти</button>
            </form>
        </span>
        <span class="account" sec:authorize="isAnonymous()">
            <a th:href="@{/login}" th:text="#{nav.login}">Увійти</a>
            <a th:href="@{/register}" th:text="#{nav.register}">Реєстрація</a>
        </span>
    </nav>
    <p class="notice" th:if="${notice}" th:text="#{${notice}(${noticeArg})}">Повідомлення</p>
    <p class="alert" th:if="${alert}" th:text="#{${alert}}">Помилка</p>
</header>
